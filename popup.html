<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YouTube Subtitle Generator</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #282828;
            --text-color: #f1f1f1;
            --text-secondary: #aaa;
            --border-color: #4d4d4d;
            --primary-color: #3ea6ff;
            --primary-hover: #68bfff;
            --progress-bg: #444;
            --disabled-color: #5f5f5f;
            --success-color: #4caf50;
            --error-color: #e74c3c;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            width: 420px;
            min-height: 500px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #2d2d2d 100%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        
        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        
        .header {
            text-align: center;
            padding: 15px 0 10px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 5px;
        }
        
        .header h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(90deg, #3ea6ff, #68bfff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }
        
        .video-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .video-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }
        
        .video-info {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        
        .thumbnail-wrapper {
            position: relative;
            flex-shrink: 0;
        }
        
        #video-thumbnail {
            width: 120px;
            height: 68px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background-color: #222;
        }
        
        .duration-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .video-details {
            flex: 1;
            min-width: 0;
        }
        
        #video-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 8px 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-color);
        }
        
        .video-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .config-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title::before {
            content: '🌐';
            font-size: 16px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #333;
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(62, 166, 255, 0.1);
        }
        
        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        #status-text {
            margin: 0 0 10px 0;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            color: var(--text-secondary);
        }
        
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--progress-bg);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        
        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-hover));
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        #progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        #startButton {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            box-shadow: 0 4px 12px rgba(62, 166, 255, 0.3);
        }
        
        #startButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(62, 166, 255, 0.5);
        }
        
        #startButton::before {
            content: '▶️';
            font-size: 16px;
        }
        
        #startButton:disabled {
            background: var(--disabled-color);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        #configButton {
            background-color: #444;
            color: white;
            flex: 0.4;
        }
        
        #configButton:hover {
            background-color: #555;
        }
        
        #configButton::before {
            content: '⚙️';
            font-size: 16px;
        }
        
        .success-message {
            color: var(--success-color);
            font-weight: 500;
        }
        
        .error-message {
            color: var(--error-color);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🎬 YouTube Subtitle Generator</h2>
            <p class="subtitle">Tạo phụ đề tự động cho video</p>
        </div>
        
        <div class="video-card">
            <div class="video-info">
                <div class="thumbnail-wrapper">
                    <img id="video-thumbnail" src="" alt="Video Thumbnail">
                </div>
                <div class="video-details">
                    <h4 id="video-title">Đang tải thông tin video...</h4>
                    <div class="video-meta">
                        <span class="meta-item" id="video-channel">📺 YouTube</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="config-section">
            <h3 class="section-title">Ngôn ngữ video</h3>
            <div class="input-group">
                <label for="language-select">Chọn ngôn ngữ gốc của video:</label>
                <select id="language-select">
                    <option value="vi-VN">🇻🇳 Tiếng Việt</option>
                    <option value="en-US">🇺🇸 Tiếng Anh</option>
                </select>
            </div>
        </div>
        
        <div class="status-section">
            <p id="status-text"></p>
            <div class="progress-bar-container">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
        
        <div class="button-group">
            <button id="configButton" title="Cấu hình server">Cài đặt</button>
            <button id="startButton">Tạo Phụ Đề</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
