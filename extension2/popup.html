<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Audio Streamer</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Settings Page -->
    <div id="settings-page" class="page active">
        <div class="header">
            <div class="header-content">
                <h1>⚙️ Configuration</h1>
                <p class="subtitle">Setup your AI connection</p>
            </div>
        </div>
        
        <div class="content">
            <div class="section">
                <label class="section-label">Connection</label>
                <div class="input-group">
                    <label for="ws-url">WebSocket URL</label>
                    <input 
                        type="text" 
                        id="ws-url" 
                        placeholder="wss://your-server.ngrok-free.app"
                        autocomplete="off"
                    >
                </div>
            </div>

            <div class="section">
                <label class="section-label">Model Settings</label>
                
                <div class="input-group">
                    <label for="asr-model">ASR Model</label>
                    <select id="asr-model" class="select-input">
                        <option value="whisper-tiny">Whisper Tiny (Fastest)</option>
                        <option value="whisper-large-v3">Whisper Large v3 (Best Quality)</option>
                        <option value="whisper-finetune">Whisper Fine-tune (Custom)</option>
                        <option value="wav2vec">Wav2Vec 2.0</option>
                        <option value="wav2vec-finetune">Wav2Vec Fine-tune (Custom)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="target-lang">Target Language</label>
                    <select id="target-lang" class="select-input">
                        <option value="vie">🇻🇳 Vietnamese</option>
                        <option value="eng">🇬🇧 English</option>
                        <option value="jpn">🇯🇵 Japanese</option>
                        <option value="kor">🇰🇷 Korean</option>
                        <option value="chn">🇨🇳 Chinese</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button id="test-connection" class="btn btn-secondary">
                    <span class="btn-icon">🔌</span> Test
                </button>
                <button id="save-settings" class="btn btn-primary">
                    <span class="btn-icon">💾</span> Save & Connect
                </button>
            </div>

            <div id="connection-status" class="status-message hidden"></div>
        </div>
    </div>

    <!-- Main Page -->
    <div id="main-page" class="page">
        <div class="header">
            <button id="back-to-settings" class="icon-btn" title="Settings">
                <span>⚙️</span>
            </button>
            <div class="header-content">
                <h1>🎙️ Live Stream</h1>
                <p class="subtitle" id="current-config-display">Ready to capture</p>
            </div>
        </div>

        <div class="content centered">
            <!-- Recording Status -->
            <div class="status-card">
                <div class="status-indicator" id="status-indicator">
                    <div class="pulse-dot"></div>
                    <span id="status-text">Standby</span>
                </div>
                <div class="timer" id="recording-timer">00:00</div>
            </div>

            <!-- Main Control Button -->
            <button id="record-btn" class="record-btn">
                <div class="record-icon-wrapper">
                    <div class="record-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </div>
                </div>
                <span class="record-text">Start Streaming</span>
            </button>

            <!-- Info Footer -->
            <div class="info-footer">
                <div class="info-item">
                    <span class="label">Model:</span>
                    <span class="value" id="display-model">--</span>
                </div>
                <div class="info-item">
                    <span class="label">Target:</span>
                    <span class="value" id="display-lang">--</span>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
